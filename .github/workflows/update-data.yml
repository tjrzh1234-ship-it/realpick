name: 공고·금리 자동 갱신

on:
  schedule:
    # 매일 오전 6시 17분(한국 시간) = 전날 21:17 UTC
    - cron: "17 21 * * *"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 실거래가 시세 캐시는 저장소가 아니라 GitHub 캐시에 보관 (저장소가 커지지 않게)
      - name: 실거래가 캐시 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            rtms-cache.json
            geo-cache.json
            photo-cache.json
          key: rtms-${{ github.run_id }}
          restore-keys: rtms-

      - name: 공고·금리·공매·정책뉴스·분양 수집
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node scripts/update.mjs

      - name: 실거래가 캐시 저장
        if: always() && hashFiles('rtms-cache.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            rtms-cache.json
            geo-cache.json
            photo-cache.json
          key: rtms-${{ github.run_id }}

      - name: 바뀐 내용이 있으면 저장
        if: always()
        run: |
          git config user.name "realpick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 예전에 저장소에 올라간 캐시 파일은 저장소에서만 뺀다
          for c in rtms-cache.json geo-cache.json photo-cache.json; do if git ls-files --error-unmatch $c >/dev/null 2>&1; then git rm --cached -q $c; fi; done
          for f in notices.json rates.json auctions.json auction-rounds.json insight.json housing.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
