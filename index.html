<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="매물 검색, 실거래가·AI 추정 시세 비교, 커뮤니티와 전문가 인사이트를 한곳에서 제공하는 부동산 플랫폼 리얼픽">
<title>리얼픽 부동산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: sticky top bar + one 1180px column; each route is a stack of titled sections */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --sunk:#eceff6; --line:#dde2ec;
  --fg:#141a2b; --muted:#5b6478; --faint:#8a92a5;
  --accent:#2457e0; --accent-ink:#ffffff; --accent-soft:#e6ecfd;
  --hot:#e5532a; --hot-soft:#fdebe5; --ok:#1d8a5a; --ok-soft:#e1f3ea; --warn:#b7790a; --warn-soft:#fbf1dc;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#161b2c; --sunk:#1d2337; --line:#2a3149;
  --fg:#e8ecf6; --muted:#a2abc1; --faint:#737c93;
  --accent:#6f95ff; --accent-ink:#0b1020; --accent-soft:#1f2b52;
  --hot:#ff7a52; --hot-soft:#3a1f19; --ok:#4cc98d; --ok-soft:#14301f; --warn:#e9b04a; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161b2c; --sunk:#1d2337; --line:#2a3149;
  --fg:#e8ecf6; --muted:#a2abc1; --faint:#737c93;
  --accent:#6f95ff; --accent-ink:#0b1020; --accent-soft:#1f2b52;
  --hot:#ff7a52; --hot-soft:#3a1f19; --ok:#4cc98d; --ok-soft:#14301f; --warn:#e9b04a; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:62px}
.logo{font-family:var(--display);font-weight:800;font-size:21px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:15px}
nav.gnb{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.gnb a{padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.gnb a:hover{background:var(--sunk);color:var(--fg)}
nav.gnb a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:820px){.top .wrap{flex-wrap:wrap;height:auto;padding-block:10px;gap:8px}.logo{flex:1}nav.gnb{order:3;flex-basis:100%}.top-actions .btn:not(.primary){display:none}}

main{padding-block:28px 64px}
section.block{margin-top:44px}
section.block:first-child{margin-top:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:21px;font-weight:800}
.sec-head .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:2px}
.more{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
.more:hover{color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.hero-main{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:30px;position:relative;overflow:hidden;min-width:0}
.hero-main::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;border:40px solid color-mix(in srgb,var(--accent-ink) 12%,transparent)}
.hero-main h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;line-height:1.3;max-width:15em}
.hero-main p{opacity:.85;margin:10px 0 20px;max-width:32em}
.aibar{display:flex;gap:8px;background:var(--surface);border-radius:12px;padding:6px;position:relative;z-index:1}
.aibar input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:8px 10px;outline:none}
.aibar .btn{border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.chips button{border:1px solid color-mix(in srgb,var(--accent-ink) 35%,transparent);background:transparent;color:var(--accent-ink);border-radius:999px;padding:4px 11px;font-size:13px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.quick a{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center}
.quick a:hover{border-color:var(--accent)}
.quick svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.quick a.hl{background:var(--accent-soft);border-color:transparent}
@media (max-width:860px){.hero{grid-template-columns:1fr}}

/* listing cards */
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:960px){.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.rail{grid-template-columns:1fr}}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.lthumb{aspect-ratio:16/10;max-width:100%;position:relative;background:var(--sunk)}
.lthumb canvas{width:100%;height:100%;display:block}
.tag{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--hot);color:#fff}
.lbody{padding:14px;display:grid;gap:6px}
.lbody .kind{font-size:12px;color:var(--muted);font-weight:600}
.lbody .ttl{font-weight:600;line-height:1.45}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--display);font-size:19px;font-weight:800}
.price s{color:var(--faint);font-size:13px}
.drop{color:var(--hot);font-weight:700;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;color:var(--muted)}
.kv dt{color:var(--faint)}
.kv dd{margin:0;text-align:right}

/* two-col */
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:900px){.duo{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.post{display:grid;gap:4px;padding:13px 0;border-top:1px solid var(--line)}
.post:first-of-type{border-top:0}
.post .cat{font-size:12px;font-weight:700;color:var(--accent)}
.post .t{font-weight:600}
.post .ex{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:12px;font-size:12px;color:var(--faint);flex-wrap:wrap}

/* notice mini + list */
.nmini{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.nmini:first-of-type{border-top:0}
.nmini .t{font-weight:600;font-size:14px;line-height:1.45}
.nmini .s{font-size:12px;color:var(--faint)}
.dday{font-family:var(--mono);font-weight:600;font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap;text-align:center;min-width:52px}
.dday.open{background:var(--accent-soft);color:var(--accent)}
.dday.soon{background:var(--hot-soft);color:var(--hot)}
.dday.upcoming{background:var(--warn-soft);color:var(--warn)}
.dday.closed{background:var(--sunk);color:var(--faint)}
.dday.budget{background:var(--ok-soft);color:var(--ok)}

/* rates */
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:960px){.rates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.rates{grid-template-columns:1fr}}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rate .lbl{font-size:13px;color:var(--muted);font-weight:600}
.rate .v{display:flex;align-items:baseline;gap:8px;margin:4px 0 6px}
.rate .v b{font-family:var(--mono);font-size:28px;font-weight:600}
.rate .v span{font-family:var(--mono);font-size:13px;color:var(--hot)}
.rate svg{width:100%;height:56px;display:block}
.rate .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-family:var(--mono)}

/* lectures */
.lec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.lec .cover{height:92px;border-radius:9px;background:var(--sunk);display:flex;align-items:end;padding:10px;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.3}
.lec .who{font-size:13px;color:var(--muted)}
.lec .p{font-weight:700}

/* listings page */
.mapwrap{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
.map{position:relative;height:520px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.map canvas{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgb(0 0 0/.12)}
.pin.hot{background:var(--hot);color:#fff;border-color:var(--hot)}
.pin:hover,.pin.sel{outline:2px solid var(--accent)}
.listcol{display:grid;gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.lrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;text-align:left;width:100%}
.lrow.sel{border-color:var(--accent)}
.note{font-size:12.5px;color:var(--faint)}

/* insight hub */
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.subnav a{padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav a[aria-current="page"]{color:var(--fg);border-color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.column{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.column .by{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.column .by i{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.column h3{font-size:17px;font-weight:700;line-height:1.4}

/* support page */
.feed{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-6px 0 16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sbox{flex:1;min-width:240px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 6px}
.sbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:7px;outline:none}
.aitog{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--surface);color:var(--muted)}
.aitog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.status{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.status button b{font-family:var(--mono);font-weight:600;margin-left:4px;color:var(--faint)}
.status button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.status button[aria-pressed="true"] b{color:var(--accent)}
.understood{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.understood span{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;margin:0 3px;font-weight:600}
.ncards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.ncards{grid-template-columns:1fr}}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.ncard .row1{display:flex;align-items:center;gap:8px}
.ncard .reg{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.ncard .realm{font-size:12px;font-weight:700;color:var(--accent)}
.ncard .icons{margin-left:auto;display:flex;gap:2px}
.icon{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.icon:hover{background:var(--sunk);color:var(--fg)}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon[aria-pressed="true"]{color:var(--hot)}
.icon[aria-pressed="true"] svg{fill:currentColor}
.ncard .t{font-weight:700;font-size:15.5px;line-height:1.45}
.ncard .t:hover{color:var(--accent)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;background:var(--sunk);border-radius:9px;padding:10px 12px}
.facts dt{color:var(--faint)}
.facts dd{margin:0;min-width:0}
.ncard .sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .sum b{color:var(--accent);margin-right:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:40px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pager button{min-width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono)}
.pager button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.faq{margin-top:36px;display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:65ch}

/* detail */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-weight:600;margin-bottom:14px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:1fr}}
.dhead h1{font-size:clamp(20px,2.6vw,26px);font-weight:800;line-height:1.4;margin:8px 0 14px}
.ticket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ticket>div{padding:12px 14px;border-left:1px dashed var(--line);min-width:0}
.ticket>div:first-child{border-left:0}
.ticket .k{font-size:12px;color:var(--faint)}
.ticket .v{font-weight:700;font-size:14px}
@media (max-width:640px){.ticket{grid-template-columns:1fr 1fr}.ticket>div:nth-child(3){border-left:0}.ticket>div:nth-child(n+3){border-top:1px dashed var(--line)}}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:14px}
.dsec h2{font-size:16px;font-weight:800;margin-bottom:10px}
.dsec p{margin:0;max-width:68ch}
.aisum{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.aisum h2{color:var(--accent)}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-top:8px;font-size:13.5px;min-width:0}
.file .ext{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--sunk);border-radius:5px;padding:2px 6px}
.file span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:grid;gap:12px}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:13px;background:var(--sunk);padding:6px 8px;border-radius:7px}

/* AI chat drawer */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px rgb(0 0 0/.2)}
.drawer{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:26;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 140px));background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 12px 40px rgb(0 0 0/.25);overflow:hidden}
.drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-family:var(--display)}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{background:var(--sunk)}
.drawer form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.drawer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:9px 10px;font:inherit}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:28px;font-size:13px;color:var(--muted)}
footer .wrap{display:grid;gap:8px}
footer nav{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}

const day = s => new Date(s+'T00:00:00+09:00');
function statusOf(n){
  if(n.budgetBased) return 'budget';
  const b=day(n.reqstBegin), e=day(n.reqstEnd);
  if(b>TODAY) return 'upcoming';
  if(e<TODAY) return 'closed';
  return (e-TODAY)/864e5<=7 ? 'soon':'open';
}
function ddayLabel(n){
  const st=statusOf(n);
  if(st==='budget') return '예산소진시';
  if(st==='upcoming') return '접수예정';
  if(st==='closed') return '마감';
  const d=Math.round((day(n.reqstEnd)-TODAY)/864e5);
  return d===0?'D-DAY':'D-'+d;
}
const ST_NAME={all:'전체',open:'진행중',soon:'마감임박',upcoming:'접수예정',closed:'마감',budget:'예산 소진 시까지'};

function rateCard(r){
  const v=r.v, last=v[v.length-1], diff=(last-v[v.length-2]).toFixed(2);
  const lo=Math.min(...v)-.1, hi=Math.max(...v)+.1, W=200,H=56,p=4;
  const pts=v.map((y,i)=>[p+i*(W-2*p)/(v.length-1), H-p-(y-lo)/(hi-lo)*(H-2*p)]);
  const line=pts.map(q=>q.join(',')).join(' ');
  const area=`M${pts[0][0]},${H} L`+pts.map(q=>q.join(',')).join(' L')+` L${pts.at(-1)[0]},${H}Z`;
  return `<div class="rate"><div class="lbl">${esc(r.k)}</div><div class="v"><b>${last.toFixed(2)}%</b><span>${diff>0?'▲':'–'} ${Math.abs(diff).toFixed(2)}</span></div>

const S = {q:'',ai:true,status:'all',realm:'',region:'',sort:'new',scope:'all',page:1};

function parseAI(q){
  const out={region:'',realm:'',status:'',rest:q};
  REGIONS.forEach(r=>{if(q.includes(r)){out.region=r;out.rest=out.rest.replace(r,'')}});
  REALMS.forEach(r=>{if(q.includes(r)){out.realm=r;out.rest=out.rest.replace(r,'')}});
  if(/마감\s*임박|급한|곧\s*마감/.test(q)){out.status='soon';out.rest=out.rest.replace(/마감\s*임박|급한|곧\s*마감/,'')}
  else if(/진행|신청\s*가능|지금/.test(q)){out.status='open';out.rest=out.rest.replace(/진행\s*중?|신청\s*가능한?|지금/,'')}
  out.rest=out.rest.replace(/지원사업|지원금|공고|사업|관련|찾아줘|보여줘|알려줘|있어\??/g,' ').replace(/\s+/g,' ').trim();
  return out;
}
function filtered(){
  let q=S.q.trim(), realm=S.realm, region=S.region, status=S.status, ai=null;
  if(S.ai && q){ai=parseAI(q); realm=realm||ai.realm; region=region||ai.region; if(ai.status&&status==='all')status=ai.status; q=ai.rest}
  let rows=FEED.items.filter(n=>{
    const st=statusOf(n);
    if(status==='open' && !(st==='open'||st==='soon')) return false;
    if(status!=='all' && status!=='open' && st!==status) return false;
    if(realm && n.realm!==realm) return false;
    if(region && n.region!==region && n.region!=='전국') return false;
    if(q){
      const words=q.split(' ').filter(Boolean);
      const hay = S.scope==='title'?n.pblancNm : S.scope==='org'? (n.jrsdInsttNm+' '+n.excInsttNm) : S.scope==='content'?(n.bsnsSumryCn||'') : n.pblancNm+' '+(n.bsnsSumryCn||'')+' '+n.trgetNm;
      if(!words.every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  rows.sort((a,b)=> S.sort==='view'? b.inqireCo-a.inqireCo : S.sort==='old'? a.creatPnttm.localeCompare(b.creatPnttm) : b.creatPnttm.localeCompare(a.creatPnttm));
  return {rows,ai,realm,region,status};
}
function countBy(st){return FEED.items.filter(n=>{const s=statusOf(n);return st==='all'||(st==='open'?(s==='open'||s==='soon'):s===st)}).length}

function route(){return (location.hash||'#home').slice(1)||'home'}
function render(){
  const r=route(); const app=$('#app');
  let html, nav=r;
  if(r==='listings') html=viewListings();
  else if(r==='community') html=viewCommunity();
  else if(r==='lectures') html=viewLectures();
  else if(r==='insight') html=viewInsight();
  else if(r==='rates'){html=viewRates();nav='insight'}
  else if(r==='support'){html=viewSupport();nav='insight'}
  else if(r.startsWith('notice-')){html=viewNotice(r.slice(7));nav='insight'}
  else {html=viewHome();nav='home'}
  app.innerHTML=`<div class="view">${html}</div>`;
  document.querySelectorAll('[data-nav]').forEach(a=>{a.dataset.nav===nav?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  paintArt(); if(r==='listings') paintMap();
}
let lastRoute=route();
addEventListener('hashchange',()=>{const r=route();render();if(r!==lastRoute)scrollTo({top:0});lastRoute=r});

  if(t.closest('#aiTog')){S.ai=!S.ai;render();return}
  const fv=t.closest('[data-fav]'); if(fv){const id=fv.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();fv.setAttribute('aria-pressed',favs.has(id));toast(favs.has(id)?'관심 공고에 담았어요':'관심 공고에서 뺐어요');return}
  const sh=t.closest('[data-share]'); if(sh){copyText(location.href.split('#')[0]+'#notice-'+sh.dataset.share,'링크를 복사했어요');return}
  const cp=t.closest('[data-copy]'); if(cp){copyText(cp.dataset.copy,'이메일 주소를 복사했어요');return}
});
async function copyText(s,msg){try{await navigator.clipboard.writeText(s);toast(msg)}catch(err){toast(s)}}
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='sForm'){S.q=$('#sIn').value;S.page=1;render();}
  if(e.target.id==='heroForm'){const v=$('#heroIn').value.trim();if(v)openChat(v)}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='selRealm'){S.realm=e.target.value}
  else if(id==='selRegion'){S.region=e.target.value}
  else if(id==='selSort'){S.sort=e.target.value}
  else if(id==='selScope'){S.scope=e.target.value}
  else return;
  S.page=1;render();
});

/* ---------- 썸네일·지도 그리기 ---------- */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function paintArt(){
  document.querySelectorAll('canvas[data-art]').forEach(c=>{
    const w=c.clientWidth||300,h=c.clientHeight||180,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
    const seed=+c.dataset.art; let s=seed*9301; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
    g.fillStyle=cssVar('--sunk');g.fillRect(0,0,w,h);
    g.fillStyle=cssVar('--accent-soft');g.fillRect(0,h*.72,w,h);
    const n=3+Math.floor(rnd()*3);
    for(let i=0;i<n;i++){const bw=w/(n+1)*(0.7+rnd()*.5),bx=w*(i+.6)/(n+1)-bw/2+rnd()*8,bh=h*(.3+rnd()*.45);
      g.fillStyle=i===Math.floor(n/2)?cssVar('--accent'):cssVar('--line');g.fillRect(bx,h*.72-bh,bw,bh);
      g.fillStyle=cssVar('--surface');for(let y=h*.72-bh+8;y<h*.72-10;y+=13)for(let x=bx+6;x<bx+bw-8;x+=12)g.fillRect(x,y,6,7);}
  });
}
function paintMap(){
  const c=$('#mapCanvas'); if(!c) return; const w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
  g.fillStyle=cssVar('--sunk');g.fillRect(0,0,w,h);
  g.strokeStyle=cssVar('--line');g.lineWidth=1;for(let x=0;x<w;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
  g.strokeStyle=cssVar('--accent-soft');g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(0,h*.55);g.bezierCurveTo(w*.3,h*.45,w*.55,h*.62,w,h*.5);g.stroke();
  g.strokeStyle=cssVar('--surface');g.lineWidth=6;[[0,h*.2,w,h*.35],[w*.5,0,w*.45,h],[w*.15,h,w*.35,0]].forEach(([a,b,c2,d])=>{g.beginPath();g.moveTo(a,b);g.lineTo(c2,d);g.stroke()});
  g.fillStyle=cssVar('--faint');g.font='600 12px '+cssVar('--body');[['범어동',.6,.44],['동성로',.4,.53],['상인동',.24,.72],['침산동',.36,.19],['신서동',.8,.24],['지산동',.66,.77]].forEach(([t,x,y])=>g.fillText(t,w*x,h*y));
}
addEventListener('resize',()=>{paintArt();paintMap()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{paintArt();paintMap()});
new MutationObserver(()=>{paintArt();paintMap()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- AI 채팅 ---------- */
let samplePromise=null, history=[];
function openChat(prefill){$('#drawer').hidden=false;$('#chatIn').focus();if(prefill){$('#chatIn').value=prefill;$('#chatForm').requestSubmit()}}
$('#fab').onclick=()=>{const d=$('#drawer');d.hidden=!d.hidden;if(!d.hidden)$('#chatIn').focus()};
$('#closeChat').onclick=()=>{$('#drawer').hidden=true};
function addMsg(cls,text){const m=document.createElement('div');m.className='msg '+cls;m.textContent=text;$('#msgs').appendChild(m);$('#msgs').scrollTop=1e9;return m}
$('#chatForm').addEventListener('submit',async e=>{
  e.preventDefault(); e.stopPropagation();
  const q=$('#chatIn').value.trim(); if(!q) return; $('#chatIn').value='';
  addMsg('me',q); const out=addMsg('ai','생각하는 중…');
  samplePromise = samplePromise || (window.claude?.use ? window.claude.use('sample') : Promise.resolve(null));
  const sample=await samplePromise;
  if(!sample){out.textContent='AI 채팅은 준비 중이에요. 곧 연결될 예정입니다.';return}
  const ctx='너는 부동산 플랫폼 "리얼픽"의 AI 상담원이다. 한국어로 4~6문장 이내로 간결하게 답한다. 투자 권유나 확정적 수익 예측은 하지 말고, 확인할 지표(호가·실거래가·AI 추정가 차이, 수익률, 금리, 공실, 권리관계)를 안내한다. 참고용 예시 매물: '+LISTINGS.map(l=>`${l.kind}/${l.area}/${l.title}/호가 ${won(l.ask)}/실거래 ${won(l.real)}/AI추정 ${won(l.avm)}`).join('; ')+'. 현재 접수 중인 정부지원 공고: '+FEED.items.filter(n=>statusOf(n)!=='closed').map(n=>`${n.pblancNm}(${n.reqstEnd} 마감)`).join('; ')+'. 최근 기준금리 3.00%, 주담대 4.88%.';
  history.push({role:'user',content:(history.length?'':ctx+'\n\n질문: ')+q});
  try{
    const r=await sample(history,{onText:({text})=>{out.textContent=text},cache:false});
    out.textContent=r.text; history.push({role:'assistant',content:r.text});
  }catch(err){
    history.pop();
    out.textContent = err?.code==='not_granted' ? 'AI 사용 권한이 허용되지 않았어요.' : err?.code==='rate_limited' ? '요청이 많아요. 잠시 후 다시 시도해 주세요.' : '답변을 가져오지 못했어요. 다시 시도해 주세요.';
  }
});

render(); loadFeed();
